name: docs

on:
  push:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Install package + docs group
        run: poetry install --with docs
      - name: Build HTML (warnings are errors)
        run: poetry run make -C docs clean html
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: protea-runners-docs
          path: docs/build/html
          if-no-files-found: error
