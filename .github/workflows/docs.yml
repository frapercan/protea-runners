name: docs

# Documentation is published by Read the Docs (slug: protea-runners) at
# https://protea-runners.readthedocs.io. This workflow is a quality gate only:
# it builds the Sphinx HTML with warnings promoted to errors so a broken doc
# tree fails CI. It does not deploy anything.

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Install package + docs group
        run: poetry install --with docs
      - name: Build HTML (warnings are errors)
        run: poetry run sphinx-build -W --keep-going -b html docs/source docs/build/html
