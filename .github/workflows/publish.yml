name: publish

# Publishes the package to PyPI via Trusted Publishing (OIDC, no API token).
# Fires only when a GitHub Release is published, so day-to-day pushes and
# tags never trigger an upload. The release at v1.0 is coordinated separately;
# this repo stays at 0.0.1 until then.
#
# Manual prerequisites (one-time, outside this repo):
#   1. The `protea-runners` project name must be claimed on PyPI.
#   2. A PyPI trusted publisher must be registered for this repository,
#      workflow `publish.yml`, and environment `pypi`.
# Until both are in place this workflow is a no-op (it never runs without a
# published release) and a triggered run would fail the upload step.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/protea-runners
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
